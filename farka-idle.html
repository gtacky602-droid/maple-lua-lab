<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ファルカの二刀待機</title>
<link rel="stylesheet" href="compare.css">
<style>
 main{max-width:880px}.scenes canvas{aspect-ratio:1;background:#19363c}.toolbar label{display:flex;align-items:center;gap:7px}
 .scenes[data-variant=guide] canvas{background:#19363c url('./assets/mondstadt-background.png') center bottom/cover no-repeat}
 fieldset{border:1px solid #527669;border-radius:8px;margin:0 0 16px;padding:10px 12px;min-width:0}
 input[type=range]{width:105px;accent-color:#bfceab} input[type=checkbox]{accent-color:#bfceab}
</style>
<main>
 <header><h1>ファルカの二刀待機</h1><a href="bosses-art.html?q=farka">ボス素材へ</a></header>
 <form id="pose" aria-label="待機絵の表示設定">
  <div class="toolbar">
   <label>向き <select id="facing"><option value="right">右向き</option><option value="left">左向き</option></select></label>
   <label>比較 <select id="variant"><option value="current">二刀の分離</option><option value="guide">低頭身の試作</option></select></label>
   <label>表示 <select id="profile"><option value="png">PNG</option><option value="legacy">標準矩形</option><option value="h48c32">中間・32色</option><option value="h32c16">最軽量・16色</option></select></label>
   <label><input type="checkbox" id="markers">足元と手の支点</label>
   <button type="reset">初期状態に戻す</button>
  </div>
  <fieldset class="toolbar">
   <legend>重ねる素材</legend>
   <label><input type="checkbox" id="body" checked>身体</label>
   <label><input type="checkbox" id="front" checked>手前の剣</label>
   <label>手前の角度 <input type="range" id="frontAngle" min="-25" max="25" value="0"></label>
   <label><input type="checkbox" id="back" checked>奥の剣</label>
   <label>奥の角度 <input type="range" id="backAngle" min="-25" max="25" value="0"></label>
  </fieldset>
 </form>
 <section class="scenes" aria-label="待機絵の比較">
  <article><div class="title"><h2 id="referenceTitle">元の待機絵</h2></div><canvas id="reference" aria-labelledby="referenceTitle"></canvas></article>
  <article><div class="title"><h2 id="layeredTitle">身体と二刀を重ねた絵</h2></div><canvas id="layered" aria-labelledby="layeredTitle"></canvas></article>
 </section>
 <p id="status" class="note" role="status">素材を読み込み中</p>
</main>
<script type="module" src="farka-idle.js"></script>
</html>
