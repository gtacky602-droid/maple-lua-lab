<p>左：元PNG ／ 右：矩形描画。同じ足元・表示サイズで比較します。待機絵の候補で、歩行・戦闘アニメーションは未完成です。<a href="farka-idle.html">ファルカの身体と二刀を比較</a></p>
<header><label>軽量設定 <select id="profile"><option value="legacy">標準</option><option value="h48c32">中間・32色</option><option value="h32c16" selected>最軽量・16色</option></select></label><label>拡大 <select id="zoom"><option value="1">実寸</option><option value="2" selected>2倍</option><option value="3">3倍</option></select></label><label><input type="checkbox" id="flip">左向き</label></header>
<p class="note">待機素材の制作候補を比較する画面です。参照の確認範囲は素材ごとの制作記録に残しています。表示できても、固有戦闘・動作・本編配置の完成を意味しません。表示高は比較用です。矩形削減率は標準矩形版との比較で、実機FPSではありません。最軽量では顔・装飾・細い模様が省略されます。</p>
