<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マップと敵の配置プレビュー</title>
<style>body{margin:20px;background:#102b33;color:#e3f4f4;font:16px sans-serif}a{color:#94e8e5}header,.controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:24px}select{min-width:0}select,button{padding:8px;background:#24515b;color:white;border:1px solid #638991;border-radius:6px;max-width:100%}label{max-width:100%;min-width:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:16px}figure{margin:16px 0}canvas{width:100%;image-rendering:pixelated;border:1px solid #638991;box-sizing:border-box}figcaption{margin-bottom:8px}.note{color:#b4d3d5}input{max-width:100%;min-width:0}#placements{display:flex;gap:8px;flex-wrap:wrap}#placements span{padding:8px;background:#193c45;border-radius:6px}button:disabled{opacity:.5}</style>
<header><h1>マップと敵の配置プレビュー</h1><a href="index.html">ラボ</a><a href="enemies-art.html">敵素材</a><a href="characters-art.html">旅人と同行者</a></header>
<p>本編の仮地点・足場に、敵の待機絵を重ねて比較します。背景は仮画像、本番は3Dを想定しています。ここでの配置案は戦闘やセーブには反映されません。</p>
<div class="controls"><label>地点 <select id="node"></select></label><label>軽量設定 <select id="profile"><option value="legacy">標準</option><option value="h48c32">中間・32色</option><option value="h32c16" selected>最軽量・16色</option></select></label><label>カメラ <input id="camera" type="range" min="0" value="0" step="1"><output id="cameraValue">0</output></label></div>
<p id="context" class="note"></p><div class="controls"><label>追加する敵 <select id="species"><option value="dendro-fungus">浮遊草キノコン（待機候補）</option><option value="ruin-guard">遺跡守衛（待機候補）</option><option value="hilichurl" selected>ヒルチャール</option><option value="hydro-slime">水スライム（旧候補）</option><option value="pyro-slime">炎スライム（旧候補）</option><option value="hydro-slime-reference">水スライム（参照付き新候補）</option><option value="pyro-slime-reference">炎スライム（参照付き新候補）</option></select></label><button id="loadLive">この地点の本編配置を読み込む</button><button id="undo">この地点の編集を取り消す</button><button id="reset">この地点の初期案へ戻す</button><button id="export">配置案をJSON保存</button></div>
<label>保存した配置案を読み込む <input id="import" type="file" accept=".json,application/json"></label><p id="fileStatus" role="status" class="note">読み込むと全地点の編集案を置き換えます。必要な案は先にJSON保存してください。</p>
<p class="note">「本編配置を読み込む」でこの地点の編集案を置き換えます。取り消しで元の案に戻せます。画像をクリックすると、近い足場の上へ敵を追加できます。別地点へ移っても案はこの画面内で保持します。再読み込みで初期案へ戻ります。必要な案はJSON保存してください。</p>
<main><figure><figcaption>元PNG</figcaption><canvas id="png" width="960" height="540"></canvas></figure><figure><figcaption>軽量矩形版</figcaption><canvas id="rect" width="960" height="540"></canvas></figure></main>
<div id="placements"></div><p id="status" role="status">読み込み中</p><script type="module" src="map-art.js"></script></html>
